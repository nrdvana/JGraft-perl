name             = JGraft
abstract         = Apply or create structural diffs between trees of data
author           = Michael Conrad <mike@nrdvana.net>
license          = Perl_5
copyright_holder = Michael Conrad, and IntelliTree Solutions

[MetaResources]
bugtracker.web   = https://github.com/nrdvana/JGraft-perl/issues
repository.web   = https://github.com/nrdvana/JGraft-perl
repository.url   = https://github.com/nrdvana/JGraft-perl.git
repository.type  = git

[@Git]
[Git::GatherDir]
include_untracked = 0
exclude_filename = META.json   ; The copies in version control are only for letting
exclude_filename = Makefile.PL ; GitHub Actions run without installing Dist::Zilla
[Git::NextVersion]
[OurPkgVersion]
[ExecDir]

[PodWeaver]

; authordep Test::Pod::Coverage
; authordep Pod::Coverage::TrustPod
; authordep Test::Pod
[AutoPrereqs]
[Prereqs / RuntimeRequires]
[Prereqs / ConfigureRequires]
[Prereqs / TestRequires]
Test2::Suite = 0.000156

[ExtraTests]
[Test::Pod::Coverage::Configurable]
also_private = BUILDARGS
also_private = BUILD
[PodSyntaxTests]

[MakeMaker]
[Manifest]
[License]
[MetaYAML]
[MetaJSON]
[UploadToCPAN]
